<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blinkling</title>
    <link rel="stylesheet" href="../shared/look.css" />
    <link rel="stylesheet" href="selection.css" />
  </head>
  <body>
    <img id="frame" alt="" />
    <div id="windows" aria-hidden="true"></div>
    <svg id="shade" aria-hidden="true">
      <defs>
        <mask id="outside">
          <rect width="100%" height="100%" fill="white" />
          <rect id="hole" fill="black" />
        </mask>
      </defs>
      <rect width="100%" height="100%" mask="url(#outside)" />
    </svg>
    <div id="selection"><span id="size"></span></div>
    <button id="chip" type="button" tabindex="-1"></button>
    <div id="hint" role="status"></div>
    <script type="module" src="selection.mjs"></script>
  </body>
</html>
