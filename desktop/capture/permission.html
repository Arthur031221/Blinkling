<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <title>允許螢幕擷取</title>
    <link rel="stylesheet" href="permission.css" />
  </head>
  <body>
    <main>
      <svg class="blink" viewBox="0 0 90 90" role="img" aria-label="Blink">
        <rect
          x="16"
          y="15"
          width="58"
          height="61"
          rx="27"
          fill="#3ddc97"
          stroke="#0c0e0d"
          stroke-width="3"
        />
        <path
          d="M34 38v9m22-9v9m-20 9q9 10 18 0"
          fill="none"
          stroke="#0c0e0d"
          stroke-width="4"
          stroke-linecap="round"
        />
      </svg>
      <p>開啟 Blinkling 的螢幕錄製權限，擷取會自動繼續。</p>
      <div class="settings-demo" aria-label="螢幕錄製權限動畫">
        <div class="sidebar">
          <b id="settings-app"></b><span id="settings-pane"></span>
        </div>
        <div class="pane">
          <h1 id="settings-section"></h1>
          <div class="app-row">
            <span class="app-icon">B</span><strong>Blinkling</strong
            ><span id="toggle" class="switch"><i></i></span
            ><svg class="pointer" viewBox="0 0 24 28" aria-hidden="true">
              <path
                d="M2 1v21l6-5 5 10 4-2-5-9h9Z"
                fill="#f5f5f4"
                stroke="#0c0e0d"
                stroke-width="2"
              />
            </svg>
          </div>
        </div>
      </div>
      <div class="buttons">
        <button id="settings">開啟設定</button><button id="cancel">取消</button>
      </div>
    </main>
    <script type="module" src="permission-ui.mjs"></script>
  </body>
</html>
