<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:"
    />
    <title>Blinkling</title>
    <link rel="stylesheet" href="../shared/look.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="mini" data-open="false">
      <button id="pause" type="button" hidden></button>

      <input id="line" type="text" autocomplete="off" spellcheck="false" />

    </main>
    <script type="module" src="./renderer.mjs"></script>
  </body>
</html>
