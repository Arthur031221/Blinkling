<!doctype html>
<meta charset="utf-8" />
<title>Pick fixture</title>
<style>
  html,
  body {
    margin: 0;
    background: #f6f1e7;
    font: 18px/28px sans-serif;
    color: #222;
  }
  body {
    padding: 24px 32px;
    width: 536px;
  }
  section {
    margin-bottom: 18px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 12px;
    width: 420px;
  }
  img {
    display: block;
    width: 200px;
    height: 120px;
    margin: 8px 0;
  }
  table {
    border-collapse: collapse;
    margin: 8px 0;
  }
  td,
  th {
    border: 1px solid #888;
    padding: 4px 14px;
  }
  pre {
    background: #222;
    color: #eee;
    padding: 8px 12px;
    width: 300px;
    margin: 8px 0;
  }
</style>
<body>
  <h1>Lake notes</h1>
  <section id="story">
    <p id="story-text">
      Blink looks at your screen when you ask it to and never clicks anything on
      its own. The second sentence of this paragraph is long enough that it
      wraps onto a further line of text.
    </p>
    <img
      id="photo"
      alt="A lake at dawn"
      src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='120'%3E%3Crect width='200' height='120' fill='%234a90a4'/%3E%3Ccircle cx='150' cy='36' r='18' fill='%23f2c14e'/%3E%3Cpath d='M0 90 L60 50 L110 90 L150 62 L200 100 V120 H0Z' fill='%232d5d6b'/%3E%3C/svg%3E"
    />
    <table id="prices">
      <tr>
        <th>Item</th>
        <th>Price</th>
      </tr>
      <tr>
        <td>Tea</td>
        <td>3</td>
      </tr>
      <tr>
        <td>Cake</td>
        <td>5</td>
      </tr>
    </table>
    <pre id="snippet">
const a = 1;
console.log(a);</pre
    >
  </section>
  <input id="secret" type="password" value="hunter2" aria-label="Password" />
</body>
