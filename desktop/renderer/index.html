<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>Blinkling</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="blink" aria-label="Blink"></main>
    <div id="menu"></div>
    <div id="auto-badge" role="status" aria-label="自動解說已開啟" hidden>
      自動解說
    </div>
    <button
      id="permission-alert"
      type="button"
      hidden
      aria-label="需要你的允許"
    >
      需要你的允許
    </button>
    <button id="pin" type="button" aria-label="釘選對話" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3h8l-1 6 4 4H5l4-4z M12 13v8" />
      </svg>
    </button>
    <article id="chat-card" hidden>
      <header>
        <span>Blink</span>
        <div>
          <button
            id="chat-pin"
            type="button"
            aria-label="釘選對話"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3h8l-1 6 4 4H5l4-4z M12 13v8" />
            </svg></button
          ><button id="chat-close" type="button" aria-label="關閉對話">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M6 18 18 6" />
            </svg>
          </button>
        </div>
      </header>
      <section id="messages" aria-live="polite"></section>
      <section id="composer-content">
        <div id="attachments"></div>
        <textarea
          id="composer-input"
          rows="3"
          aria-label="訊息"
          placeholder="問 Blink…"
        ></textarea>
      </section>
    </article>
    <script type="module" src="./index.mjs"></script>
  </body>
</html>
