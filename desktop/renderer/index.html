<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>Blinkling</title>
    <link rel="stylesheet" href="../shared/look.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="blink" aria-label="Blink"></main>
    <div id="menu"></div>
    <div id="grumble" aria-hidden="true" data-shown="false"></div>
    <div id="status" role="status" data-shown="false"></div>
    <button
      id="permission-alert"
      type="button"
      hidden
      data-text="permission"
      data-label="permission"
    ></button>
    <button id="permission-close" type="button" hidden data-label="dismiss">
      ×
    </button>
    <script type="module" src="./index.mjs"></script>
  </body>
</html>
