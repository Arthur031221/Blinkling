<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <title>Blinkling</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section id="card" aria-label="對話">
      <div class="card-controls">
        <button id="pin" aria-label="釘選對話" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3h8l-1 7 4 4H5l4-4z M12 14v7" />
          </svg>
        </button>
        <button id="close" aria-label="關閉對話">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12 M18 6 6 18" />
          </svg>
        </button>
      </div>
      <div id="card-content"></div>
      <div id="composer-slot">
        <textarea aria-label="訊息" placeholder="問 Blink…"></textarea>
      </div>
    </section>
    <script type="module" src="./card.mjs"></script>
  </body>
</html>
