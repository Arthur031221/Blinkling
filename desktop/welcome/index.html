<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Blinkling</title>
    <link rel="stylesheet" href="../shared/look.css" />
    <link rel="stylesheet" href="../pick/teach.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main
      id="welcome"
      class="welcome-card"
      role="dialog"
      aria-labelledby="welcome-title"
    >
      <header class="welcome-head">
        <div data-wordmark></div>
        <button type="button" id="welcome-close" class="welcome-x"></button>
      </header>

      <div class="welcome-stage">
        <section class="welcome-step" data-step="1">
          <div id="blink-host" class="welcome-blink" aria-hidden="true"></div>
          <h1 data-text="helloTitle" id="welcome-title"></h1>
          <p data-text="helloBody"></p>
        </section>

        <section class="welcome-step" data-step="2">
          <h1 data-text="permissionTitle"></h1>
          <p id="permission-body"></p>
          <p id="permission-status" role="status" aria-live="polite"></p>
          <div class="welcome-actions">
            <button
              type="button"
              id="permission-allow"
              data-text="permissionAllow"
            ></button>
            <button
              type="button"
              id="permission-open"
              data-text="permissionOpen"
            ></button>
          </div>
          <p data-safety class="welcome-safety"></p>
        </section>

        <section class="welcome-step" data-step="3">
          <h1 id="try-title"></h1>
          <p id="try-body"></p>
          <div id="pick-host"></div>
        </section>
      </div>

      <footer class="welcome-foot">
        <button type="button" id="welcome-back" data-text="back"></button>
        <ol class="welcome-dots" id="welcome-dots" aria-label="">
          <li></li>
          <li></li>
          <li></li>
        </ol>
        <button
          type="button"
          id="welcome-next"
          class="welcome-primary"
        ></button>
      </footer>
    </main>
    <script type="module" src="./renderer.mjs"></script>
  </body>
</html>
