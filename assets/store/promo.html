<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Blinkling promo tile</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("../../public/assets/Inter.ttf");
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 440px;
      height: 280px;
      background: #f4f0e8;
      color: #272621;
      font-family: Inter, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      padding: 0 34px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #765a45;
    }
    .eyebrow img {
      width: 38px;
      height: 47px;
    }
    h1 {
      margin: 0;
      line-height: 0;
    }
    h1 img {
      width: 250px;
      height: auto;
    }
    p {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
    }
    .note {
      font-size: 12px;
      color: #765a45;
    }
  </style>
  <body>
    <div class="eyebrow">
      <img src="../logo.svg" alt="" />A browser companion
    </div>
    <h1><img src="../brand/wordmark-light-static.svg" alt="Blinkling" /></h1>
    <p>Blink on your desktop reads the page<br />you point at, and asks.</p>
    <p class="note">Your page stays in view.</p>
  </body>
</html>
