<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Blinkling</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("../public/assets/Inter.ttf");
    }
    @font-face {
      font-family: Fraunces;
      src: url("../public/assets/Fraunces.ttf");
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 675px;
      background: #f4f0e8;
      color: #272621;
      font-family: Inter, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      gap: 64px;
      padding: 60px 72px;
    }
    .copy {
      width: 590px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }
    .eyebrow {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #765a45;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .eyebrow img {
      height: 74px;
      width: 60px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 520;
      font-size: 82px;
      letter-spacing: -4px;
      margin: 10px 0 20px;
    }
    .tagline {
      font-size: 30px;
      line-height: 1.35;
      letter-spacing: -0.6px;
      margin: 0;
      max-width: 510px;
    }
    .steps {
      display: flex;
      gap: 14px;
      margin: 32px 0;
    }
    .steps span {
      padding: 10px 15px;
      border: 1px solid #d4c9ba;
      border-radius: 24px;
      font-size: 16px;
      background: #fcfaf6;
    }
    .metric {
      font-size: 16px;
      color: #655d52;
      line-height: 1.65;
    }
    .metric strong {
      color: #34342e;
    }
    .repo {
      margin-top: 27px;
      font-size: 15px;
      letter-spacing: 0.02em;
      color: #765a45;
    }
    .panel {
      width: 386px;
      flex: none;
      height: 555px;
      border: 1px solid #d6cbbc;
      border-radius: 20px;
      background: #fffdf8;
      box-shadow:
        0 28px 60px #3b2a2025,
        0 3px 8px #3b2a2010;
      overflow: hidden;
      transform: rotate(2deg);
    }
    .panel img {
      width: 386px;
      height: 555px;
      object-fit: cover;
      object-position: top;
    }
    .label {
      position: absolute;
      bottom: 18px;
      right: 24px;
      font-size: 12px;
      color: #655d52;
    }
  </style>
  <body>
    <div class="copy">
      <div class="eyebrow">
        <img src="logo.svg" alt="Blink" />Your screen, a small question
      </div>
      <h1>Blinkling</h1>
      <p class="tagline">
        Ask about what you see.<br />Keep the answer beside it.
      </p>
      <div class="steps">
        <span>Share</span><span>Crop</span><span>Ask</span>
      </div>
      <div class="metric">
        <strong>20 / 20 screen fixtures checked</strong><br />Real local image
        requests. Method and results in the repo.
      </div>
      <div class="repo">github.com/Arthur031221/Glimpselet</div>
    </div>
    <div class="panel">
      <img src="screenshots/demo.png" alt="Blinkling panel and sample answer" />
    </div>
    <div class="label">Panel screenshot uses a labeled sample answer</div>
  </body>
</html>
