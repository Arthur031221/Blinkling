<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Blinkling</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("../public/assets/Inter.ttf");
    }
    @font-face {
      font-family: Fraunces;
      src: url("../public/assets/Fraunces.ttf");
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 675px;
      background: #f4f0e8;
      color: #272621;
      font-family: Inter, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      gap: 48px;
      padding: 60px 72px;
    }
    .copy {
      width: 500px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }
    .eyebrow {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #765a45;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .eyebrow img {
      height: 74px;
      width: 60px;
    }
    h1 {
      margin: 14px 0 22px;
      line-height: 0;
    }
    h1 img {
      width: 400px;
      height: auto;
    }
    .tagline {
      font-size: 30px;
      line-height: 1.35;
      letter-spacing: -0.6px;
      margin: 0;
      max-width: 510px;
    }
    .steps {
      display: flex;
      gap: 14px;
      margin: 32px 0;
    }
    .steps span {
      padding: 10px 15px;
      border: 1px solid #d4c9ba;
      border-radius: 24px;
      font-size: 16px;
      background: #fcfaf6;
    }
    .metric {
      font-size: 16px;
      color: #655d52;
      line-height: 1.65;
    }
    .metric strong {
      color: #34342e;
    }
    .repo {
      margin-top: 27px;
      font-size: 15px;
      letter-spacing: 0.02em;
      color: #765a45;
    }
    .panel {
      width: 520px;
      flex: none;
      align-self: center;
      height: 325px;
      border: 1px solid #d6cbbc;
      border-radius: 20px;
      background: #fffdf8;
      box-shadow:
        0 28px 60px #3b2a2025,
        0 3px 8px #3b2a2010;
      overflow: hidden;
      transform: rotate(2deg);
    }
    .panel img {
      width: 520px;
      height: 325px;
      display: block;
    }
    .label {
      position: absolute;
      bottom: 18px;
      right: 24px;
      font-size: 12px;
      color: #655d52;
    }
  </style>
  <body>
    <div class="copy">
      <div class="eyebrow">
        <img src="logo.svg" alt="Blink" />Your screen, a small question
      </div>
      <h1><img src="brand/wordmark-light-static.svg" alt="Blinkling" /></h1>
      <p class="tagline">Hold Ctrl and click.<br />Blink explains it.</p>
      <div class="steps">
        <span>Ctrl + click</span><span>Enter</span><span>Answer</span>
      </div>
      <div class="metric">
        <strong>Looks and explains. Never clicks.</strong><br />Uses your own
        signed-in Claude Code.
      </div>
      <div class="repo">github.com/Arthur031221/Blinkling</div>
    </div>
    <div class="panel">
      <img src="store/answer.png" alt="Blink answering about an arXiv page" />
    </div>
    <div class="label">Real screenshot of the Blinkling desktop app</div>
  </body>
</html>
