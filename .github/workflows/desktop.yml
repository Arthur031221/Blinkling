name: Desktop scaffold
on: [push, pull_request]
permissions:
  contents: read
env:
  # Automated runs never create Remote Control sessions in anyone's account.
  BLINKLING_REMOTE: "0"
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Electron binary is fetched here, not inside the first test's timeout.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js
      - run: npm run desktop:check
      - name: Install Linux compositor
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xfwm4 dbus-x11 libxtst6
      - name: Test Linux desktop pixels and native input
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x800x24 +extension Composite' dbus-run-session -- bash desktop/e2e/linux.sh
        env:
          # The app's own output, so a stall on a runner names its step.
          DEBUG: pw:browser
      - name: Native desktop smoke
        if: runner.os != 'Linux'
        run: npm run desktop:e2e
        env:
          # Playwright prints the app's own output, so a hang on a runner is visible.
          DEBUG: pw:browser
      - run: npm run desktop:build
      # No permission is granted on a runner, so the helper either has its tap
      # ("ready") or says "denied"; silence or a crash fails the job.
      - name: The macOS key tap starts and answers
        if: runner.os == 'macOS'
        run: |
          helper=$(ls -d release/desktop/*/Blinkling.app/Contents/Resources/blinkling-keytap)
          out=$(sleep 2 | "$helper" | head -1 || true)
          echo "key tap said: $out"
          case "$out" in "ready "*|denied) ;; *) exit 1 ;; esac
      # A Mac without Node.js: hooks stay silent and the MCP server still starts.
      - name: Plugin launcher without node on PATH
        if: runner.os != 'Windows'
        run: npx vitest run scripts/node-free-install.test.mjs
      - name: Plugin launcher without node on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\System32"
          set "ProgramFiles=%RUNNER_TEMP%\none"
          set "ProgramFiles(x86)=%RUNNER_TEMP%\none"
          set "LOCALAPPDATA=%RUNNER_TEMP%\none"
          set "USERPROFILE=%RUNNER_TEMP%\none"
          set "NVM_SYMLINK="
          set "BLINKLING_RUNTIME_DIR=%RUNNER_TEMP%\blinkling-empty"
          call bin\blinkling-run.cmd hook x.mjs
          if errorlevel 1 exit /b 1
          call bin\blinkling-run.cmd mcp x.mjs
          if not errorlevel 1 exit /b 1
          exit /b 0
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/desktop/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-failures-${{ matrix.os }}
          path: test-results/desktop/
# Packaging, the install smoke per OS and publishing live in release.yml, which
# can be dry-run from any branch.
