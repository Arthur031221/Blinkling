name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  # Automated runs never create Remote Control sessions in anyone's account.
  BLINKLING_REMOTE: "0"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb xfwm4 x11-utils x11-xserver-utils dbus-daemon
      - run: npm install --global @anthropic-ai/claude-code@2.1.296
      - run: npm run check:name
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:plugin
      - name: Check committed plugin bundle
        run: test -z "$(git status --porcelain --untracked-files=all -- bin)"
      - run: npm run validate:plugin
      - run: npm run validate:plugin:claude
      - run: npm run test:plugin
      - run: npm run test:e2e
      - run: npm run test:extension
      - run: npm run package:stores
      - run: python3 .github/workflows/check-release.py
      - run: node .github/workflows/build-pages.mjs
      - run: node .github/workflows/check-pages.mjs
      - name: Save store submission kits
        uses: actions/upload-artifact@v4
        with:
          name: blinkling-store-kits-node-${{ matrix.node }}
          path: release/
          if-no-files-found: error
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
