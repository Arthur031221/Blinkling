<!doctype html><meta charset="utf-8" /><title>Notebook exports</title
><style>
  body {
    font: 18px system-ui;
    margin: 48px;
    color: #352e26;
    background: #f6f3ed;
  }
  header {
    display: flex;
    justify-content: space-between;
  }
  button {
    font: inherit;
    padding: 12px 24px;
    background: #cb7553;
    color: white;
    border: 0;
    border-radius: 8px;
  }
  section {
    max-width: 740px;
    padding: 28px;
    background: white;
    border: 1px solid #dacebb;
    border-radius: 16px;
    margin: 28px 0;
  }
  #later {
    margin-top: 1100px;
  }
  p {
    line-height: 1.8;
  }
</style>
<header>
  <h1>Research notebook</h1>
  <button id="export">Export notebook</button>
</header>
<section>
  <h2>What is in this notebook?</h2>
  <p id="foreign">このページは研究ノートの使い方を説明します。</p>
  <p>
    Keep source links beside each note. Export a copy when you are ready to
    share your research.
  </p>
</section>
<section id="later">
  <h2>Review your sources</h2>
  <button id="review">Review sources</button>
  <p>Check each citation before publishing.</p>
</section>
